name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # --with-deps тянет системные библиотеки WebKit (libwoff2dec, libsecret, libGLESv2).
      # Локально их может не быть: без них webkit-проект падает на старте браузера,
      # и это относится к окружению, а не к коду демо.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the spec
        run: npx playwright test
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
