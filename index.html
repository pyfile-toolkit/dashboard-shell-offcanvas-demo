<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Shell demo — responsive Offcanvas (Bootstrap 5.3)</title>
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<style>
  /* Проблема, которую решает демо, видна здесь: одна и та же разметка должна быть
     offcanvas на узком экране и статичной колонкой на широком. Класс `offcanvas-md`
     переключает это сам, но НЕ убирает за собой подложку, scroll-lock и aria-модальность
     при смене ширины — поэтому в app.js есть явная уборка. */
  body { min-height: 100vh; }
  .app-shell { min-height: 100vh; }
  .app-sidebar { --bs-offcanvas-width: 260px; }
  .app-sidebar .nav-link.active { font-weight: 600; }
  .app-topbar { position: sticky; top: 0; z-index: 1020; }
  [data-route-view] { padding: 1.25rem 0; }
  .qa-hint { font-size: .875rem; color: #6c757d; }
  @media (min-width: 768px) {
    .app-sidebar { position: sticky; top: 56px; height: calc(100vh - 56px); }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-topbar border-bottom bg-body">
    <div class="container-fluid d-flex align-items-center gap-2 py-2">
      <!-- Триггер offcanvas. Виден только там, где панель действительно offcanvas. -->
      <button id="sidebarToggle" class="btn btn-outline-secondary d-md-none"
              type="button" data-bs-toggle="offcanvas" data-bs-target="#appSidebar"
              aria-controls="appSidebar" aria-label="Open navigation">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
        </svg>
      </button>
      <span class="fw-semibold">Dashboard Shell</span>
      <span class="ms-auto qa-hint" id="viewportHint"></span>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row">
      <!-- ОДНА разметка: ниже md — offcanvas, от md и выше — статичный сайдбар.
           Никаких двух копий меню (это источник рассинхрона, который и проверяет QA-матрица). -->
      <aside class="col-md-3 col-lg-2 app-sidebar offcanvas-md offcanvas-start bg-body-tertiary border-end"
             tabindex="-1" id="appSidebar" aria-labelledby="appSidebarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="appSidebarLabel">Navigation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#appSidebar" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <nav id="sidebarNav" class="nav nav-pills flex-column gap-1"></nav>
        </div>
      </aside>

      <main class="col-md-9 col-lg-10">
        <nav aria-label="breadcrumb" class="pt-3">
          <ol class="breadcrumb mb-0" id="breadcrumbs"></ol>
        </nav>
        <div data-route-view id="routeView"></div>
      </main>
    </div>
  </div>
</div>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
